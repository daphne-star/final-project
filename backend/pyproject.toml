[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-board-backend"
version = "0.1.0"
description = "Ghost Board - AI Executive Boardroom backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pydantic-ai-slim[openai,mcp]>=2.60",
    # The [mcp] extra brings the FastMCP *client*; Ghost Board also hosts
    # the server in-process, which needs the server half.
    "fastmcp-slim[server]>=4.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "email-validator>=2.2",
    # Document ingestion and brief export. These were imported by
    # services/ingestion.py and services/export.py without being declared,
    # so a clean install produced an app that failed on the first upload.
    "pypdf>=5.1",
    "python-docx>=1.1",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
